name: Chat production status

# Optional safety net after deploy. You asked for status from Cursor after pushes;
# this workflow only pings live production (no local build, no secrets needed).
on:
  workflow_dispatch:

jobs:
  prod-health:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Wait for Vercel deploy
        run: sleep 120

      - name: Production chat health
        env:
          CHAT_HEALTH_URL: https://www.chatfpl.ai/api/health/chat
        run: node scripts/chat-production-status.mjs
